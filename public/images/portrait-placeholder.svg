<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Neutral Institutional Slate Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Subtle Framing Border -->
  <rect x="12" y="12" width="376" height="476" rx="4" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Neutral Dignified Silhouette Avatar -->
  <g transform="translate(200, 215)">
    <!-- Soft circular halo -->
    <circle cx="0" cy="-25" r="90" fill="#E2E8F0" opacity="0.7" />

    <!-- Head -->
    <circle cx="0" cy="-45" r="50" fill="url(#avatarGrad)" />

    <!-- Shoulders / Torso -->
    <path d="M -90 95 C -90 20, -45 -5, 0 -5 C 45 -5, 90 20, 90 95 Z" fill="url(#avatarGrad)" />

    <!-- Civic Collar Line -->
    <path d="M -24 20 L 0 48 L 24 20" fill="none" stroke="#F1F5F9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Professional Status Notice Badge -->
  <g transform="translate(200, 385)">
    <rect x="-105" y="-14" width="210" height="28" rx="4" fill="#64748B" fill-opacity="0.1" stroke="#94A3B8" stroke-width="0.8" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1.2">
      OFFICIAL PORTRAIT PENDING
    </text>
  </g>

  <!-- Institutional Verification Subtitle -->
  <text x="200" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="0.5">
    Municipal Record Verification
  </text>
  <text x="200" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#94A3B8" text-anchor="middle">
    Awaiting verified official photography submission
  </text>
</svg>
