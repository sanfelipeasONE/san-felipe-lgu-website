<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudioVM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F4F4"/>
      <stop offset="100%" stop-color="#D5DBDB"/>
    </linearGradient>
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDC3C7"/>
      <stop offset="50%" stop-color="#95A5A6"/>
      <stop offset="100%" stop-color="#7F8C8D"/>
    </linearGradient>
    <linearGradient id="ribbonGradVM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect x="0" y="0" width="300" height="380" fill="url(#bgStudioVM)"/>

  <!-- Backdrop Glow -->
  <circle cx="150" cy="140" r="100" fill="#FFFFFF" opacity="0.6"/>

  <!-- Vice Mayor Silhouette Outline -->
  <path d="M 40,380 L 70,270 Q 110,240 150,240 Q 190,240 230,270 L 260,380 Z" fill="#E5E8E8" stroke="#BDC3C7" stroke-width="2"/>
  <rect x="132" y="195" width="36" height="35" rx="4" fill="#D5D8DC"/>
  <ellipse cx="150" cy="155" rx="45" ry="55" fill="#D5D8DC"/>

  <path d="M 105,150 Q 105,100 150,100 Q 195,100 195,150 Q 185,115 150,115 Q 115,115 105,150 Z" fill="#7F8C8D"/>

  <!-- Centered Placeholder Badge -->
  <rect x="75" y="270" width="150" height="30" rx="3" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
  <text x="150" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7F8C8D" letter-spacing="1.5" text-anchor="middle">
    [OFFICIAL PORTRAIT]
  </text>

  <!-- Inner Silver Border Frame -->
  <rect x="6" y="6" width="288" height="368" fill="none" stroke="url(#silverBorder)" stroke-width="3"/>

  <!-- Bottom Ribbon Overlay -->
  <rect x="0" y="340" width="300" height="40" fill="url(#ribbonGradVM)"/>
  <line x1="0" y1="340" x2="300" y2="340" stroke="#BDC3C7" stroke-width="1.5"/>
  <text x="150" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">
    VICE MAYOR
  </text>
</svg>
