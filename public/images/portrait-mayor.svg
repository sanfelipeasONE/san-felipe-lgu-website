<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAECEE"/>
      <stop offset="100%" stop-color="#BDC3C7"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1C40F"/>
      <stop offset="50%" stop-color="#D4AC0D"/>
      <stop offset="100%" stop-color="#9A7D0A"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B1E2D"/>
      <stop offset="100%" stop-color="#651521"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect x="0" y="0" width="300" height="380" fill="url(#bgStudio)"/>

  <!-- Official Backdrop Glow -->
  <circle cx="150" cy="140" r="100" fill="#FFFFFF" opacity="0.6"/>

  <!-- Male Portrait Outline (Formal Barong Tagalog) -->
  <!-- Shoulders / Torso -->
  <path d="M 40,380 L 70,270 Q 110,240 150,240 Q 190,240 230,270 L 260,380 Z" fill="#F8F9F9" stroke="#D0D3D4" stroke-width="2"/>

  <!-- Barong Collar & Embossed Embroidery -->
  <path d="M 125,240 L 150,265 L 175,240 L 165,225 L 135,225 Z" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1.5"/>
  <line x1="150" y1="265" x2="150" y2="380" stroke="#BDC3C7" stroke-width="2"/>
  <rect x="135" y="275" width="30" height="90" fill="none" stroke="#D5D8DC" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Official Civic Sash / Medallion Ribbon (Blue/Red/Yellow PH colors) -->
  <path d="M 80,275 L 210,380" stroke="#2471A3" stroke-width="14" opacity="0.85"/>
  <path d="M 88,275 L 218,380" stroke="#C0392B" stroke-width="8" opacity="0.85"/>
  <circle cx="150" cy="335" r="14" fill="#F1C40F" stroke="#B7950B" stroke-width="2"/>

  <!-- Neck -->
  <rect x="132" y="195" width="36" height="35" rx="4" fill="#F5CBA7"/>

  <!-- Head / Face -->
  <ellipse cx="150" cy="155" rx="45" ry="55" fill="#F5CBA7"/>

  <!-- Hair (Neat Executive Cut) -->
  <path d="M 105,150 Q 105,100 150,100 Q 195,100 195,150 Q 185,115 150,115 Q 115,115 105,150 Z" fill="#2C3E50"/>

  <!-- Glasses Frame -->
  <rect x="120" y="142" width="24" height="16" rx="3" fill="none" stroke="#34495E" stroke-width="2.5"/>
  <rect x="156" y="142" width="24" height="16" rx="3" fill="none" stroke="#34495E" stroke-width="2.5"/>
  <line x1="144" y1="148" x2="156" y2="148" stroke="#34495E" stroke-width="2"/>

  <!-- Features (Restrained Official Civic Representation) -->
  <path d="M 135,178 Q 150,186 165,178" stroke="#A93226" stroke-width="2" fill="none"/>

  <!-- Inner Gold Border Frame -->
  <rect x="6" y="6" width="288" height="368" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Bottom Ribbon Overlay -->
  <rect x="0" y="340" width="300" height="40" fill="url(#ribbonGrad)"/>
  <line x1="0" y1="340" x2="300" y2="340" stroke="#F1C40F" stroke-width="2"/>
  <text x="150" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">
    MUNICIPAL MAYOR
  </text>
</svg>
