<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="newsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <pattern id="civicNet" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#newsBgGrad)" />
  <rect width="800" height="450" fill="url(#civicNet)" />

  <!-- Accent Burgundy & Gold Banner Line -->
  <rect x="0" y="0" width="800" height="6" fill="#8B1E2D" />
  <rect x="0" y="6" width="800" height="2" fill="#C9A227" />

  <!-- Central Civic Graphic Watermark -->
  <g transform="translate(400, 205)" opacity="0.85">
    <!-- Emblem Circle -->
    <circle cx="0" cy="-20" r="64" fill="#334155" fill-opacity="0.5" stroke="#64748B" stroke-width="1.5" />
    
    <!-- Document / Newspaper Emblem -->
    <path d="M -24 -48 L 12 -48 L 24 -36 L 24 16 L -24 16 Z" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 12 -48 L 12 -36 L 24 -36" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="-16" y1="-24" x2="8" y2="-24" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-16" y1="-12" x2="16" y2="-12" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Public Information Label -->
  <g transform="translate(400, 310)">
    <rect x="-140" y="-14" width="280" height="28" rx="3" fill="#8B1E2D" fill-opacity="0.85" stroke="#B52A3A" stroke-width="1" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      OFFICIAL PUBLIC NOTICE
    </text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    MUNICIPAL GOVERNMENT OF SAN FELIPE, ZAMBALES
  </text>
  <text x="400" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">
    Design Placeholder • Official Documentation Record
  </text>
</svg>
